# =============================================================================
# 가설 사전등록 (보완안 §1 — 사후 임계값의 사전등록화)
# =============================================================================
# 각 가설은 확증적(confirmatory) 1차 지표를 **하나만** 갖는다. 1차 지표들의
# p 벡터에는 Holm 보정(가족오류율)을, 그 외 모든 탐색(exploratory) 지표에는
# BH-FDR(q=0.05)을 적용한다. 판정 문장은 p 가 아니라 효과크기+CI 중심으로
# 보고한다. 스크립트는 이 파일을 읽어 판정만 수행한다.
#
# rationale 필드는 기준 선택의 근거를 코드 밖에 문서화한다 (사후 조정 방지).
# =============================================================================

alpha_family: 0.05          # 1차 지표 가족오류율 (Holm)
fdr_q: 0.05                 # 탐색 지표 FDR

hypotheses:
  H1:
    primary: exploitability
    test: paired_perm            # 공통 상대 시드 → 짝지은 부호뒤집기
    direction: adaptive_less     # 착취가능성: adaptive < fixed
    rationale: >
      자기보호의 조작적 정의. λ_final 두표본 검정은 고정군이 상수라 퇴화 —
      폐기하고 adaptive 군 λ_final < λ_base 단일표본 순열검정을 탐색으로 보고.
  H2:
    primary: lam_final_recovery
    test: paired_perm
    direction: noisy_tft_greater  # λ_final(noisy_tft) > λ_final(exploiter)
    rationale: >
      의도/맥락 구분의 행동적 결과. 기제 귀속(β-귀인 vs 강화)은 beta_clamp ·
      intent_only 절제 대조(탐색)로 분리 검증.
  H3:
    primary: beta_discrimination
    test: paired_perm
    direction: exploiter_greater  # E[β](exploiter) > E[β](noisy_tft)
    rationale: >
      판별(discrimination) 검정. 복원(recovery: 편향·RMSE·커버리지)은
      scripts/validate_tom_recovery.py 의 별도 연구로 정량화한다.
  H4:
    primary: cc_rate
    test: paired_perm
    direction: adaptive_ge_fixed
    margin: 0.95                 # adaptive CC ≥ 0.95 × fixed CC
    floor: 0.30                  # 절대 바닥 (협력이 형성됐다고 볼 최소 CC)
    rationale: >
      margin 0.95: 조절 비용으로 인한 근소 손실 허용(비열등성). floor 0.30:
      상호배신 고착(CC≈0)과 구분되는 최소 협력 수준. 두 상수 모두 데이터
      확인 이전에 등록됨.
  H5:
    primary: joint_defense_and_payoff    # 결합가설: (i) AND (ii)
    test: paired_perm
    direction: imm_more_defense_and_less_payoff
    rationale: >
      즉각형(vmPFC)의 정의적 예측 2개의 결합. 요인 분해(2x2x2: sophisticated x
      attribution x dd_charge)는 탐색으로 보고, DD-충전 규칙 경로는 조작 확인
      (manipulation check)임을 문서에 명시한다.

      [v0.7.0 재정의 — 명세서 §1.5. 단순 리팩터가 아니라 모형 개정]
      반사실(counterfactual) 인과 귀인 도입으로 두 유형의 조작화가 더 원리적으로
      재정의된다. 종전에는 ad-hoc `dd_charges` 토글이 유형을 *정의*했으나, 이제는
      기질 귀인 방식이 유형을 정의하고 DD-충전은 그 *결과*다:
        - 정교형(rmPFC) = 반사실 귀인 사용. "내가 협력했더라도 저 상대가
          배신했을까?"(P(D|f=+1))를 물어 내 도발로 유발된 배신(유발분)을 기질
          증거에서 제외한다. 보복 나선을 기질로 오귀인하지 않는다.
        - 즉각형(vmPFC) = 반사실을 계산하지 않고 관측된 배신에 직접 반응. 자기-
          도발을 설명할 수단이 없어 모든 배신(CD ∪ DD)이 기질 증거가 된다.
      근거: ρ 는 우도에서 조건적 반응성 파라미터이지 valence 가 아니다. 실측상
      ρ 항은 ALLC(0.397)와 ALLD(0.490)를 거의 구분하지 못하며(무정보), TFT(0.256)
      가 ALLC 보다 낮게 나오는 역전까지 보였다(역정보). 반사실 판별력은
      ALLD−TFT +0.269 → +0.667, ALLD−ALLC +0.275 → +0.699 로 ~2.5배 개선된다.

      확증 검정은 **신규 정의(counterfactual)** 를 기준으로 하고, legacy
      조작화(dd_charges) 결과는 조작화 절제(ablation)로 병기해 탐색 보고한다
      (두 조작화를 나란히 비교 — 명세서 §1.5 요구). 정직 보고 원칙: 재정의로
      결과가 반전되면 기준을 재구성하고 실제 기제를 보고한다.
  H5_OPS:
    primary: operationalization_ablation
    test: paired_perm
    direction: both_operationalizations_agree
    rationale: >
      [v0.7.0 §1.5 절제] legacy(dd_charges) vs counterfactual(반사실) 두 조작화의
      결합가설 판정이 일치하는지 확인한다. 일치하면 H5 의 결론이 조작화에 강건함을
      뜻하고, 불일치하면 어느 조작화가 어떤 기제를 포착하는지 정직 보고한다.
      탐색 지표로 등록(BH-FDR).
  H6:
    primary: noise_rank_reversal
    test: paired_perm
    direction: gtft_or_wsls_beats_tft_under_noise
    rationale: >
      Axelrod 계열의 재현 확인용 정합성 검사(sanity check) 성격.
  H7:
    primary: aggregate_payoff_vs_gtft
    test: paired_perm
    direction: adaptive_greater
    rationale: >
      전 case 합산 라운드당 보수. v0.3 은 case 격자를 주기 {10,30,60,120} ×
      순환족 8종(AIF adaptive 국면 포함 3종)으로 확장 — 확증 지표는 전 case
      합산 하나로 유지하고, 주기별 Δ(P)=adaptive−GTFT 와 순환족 분해
      (fixed_cycles vs aif_cycles)는 탐색으로 보고한다. 지지 여부가 주기에
      의존하면 period_dependent 로 명시하고 그림에 병기한다(무전환 퇴화
      case — 지평 내 전환 0회 — 는 대조로 표기). 짧은 지평(T=60)에서
      미지지가 예상되며(v0.1.1 관찰) H7H 의 Δ(T)≈b·T−c·k 기제와 함께
      해석한다. λ 반응성은 무작위 정렬 순열 영가설 대비 z (탐색) — 임계값
      0.02 폐기.
  H7H:
    primary: horizon_slope_family_a
    test: slope_boot
    direction: positive          # 전환수 고정 족에서 dΔ/dT > 0 (CI 가 0 배제)
    rationale: >
      지평 의존성의 기제 분해: Δ(T) ≈ b·T − c·k. 전환수 고정 족(a)은 T 에
      선형 개선, 주기 고정 족(b)은 근사적 T-불변을 예측 — 두 족이 다른
      함수형을 예측한다는 점이 검정력의 원천. forgiveness 조작의 방향성
      예측(forgiveness↑ → T*↓)은 탐색으로 병기.
  H8:
    primary: conditional_frac_slope_lam04
    test: ols_cluster_boot
    direction: positive          # λ=0.4 조건부 frac 기울기 CI 가 0 배제
    rationale: >
      상호작용 모형 CC ~ frac*λ + frac*ratio 의 λ=0.4 조건부 기울기.
      가법 모형은 관측된 부호전환(λ≈0.24)과 모순되어 폐기. 고정전략
      대조(filler×frac 상호작용)와 ALLC 착취 이전 회계는 탐색.
  H8E:
    primary: invasion_growth_adaptive
    test: boot_ci
    direction: positive          # 기준 혼합 상주집단에 대한 침입 성장률 > 0
    rationale: >
      '집단 역학' 의 재정식화: 침입 가능성과 협력. [지표 개정 v0.6.1: 협력 유역→
      행동적 CC율 xᵀ·CCm·x; cc_widening_positive] v0.3 격자:
      env_error {0,.05,.10,.15,.20} × T {60,240}, Π seeds=50(대칭 재사용).
      확증은 err=0.10 의 지평별(T=60, T=240) 침입 성장률 g>0 두 지표 —
      지지가 지평 의존적이면 horizon_dependent 로 정직 보고(v0.1.2 에서
      T=60 은 g<0 관찰: 학습·화해 고정비용 미상환, H7H T*≈170 과 정합).
      탐색: (a) 전 격자 침입 g(즉각형 대조 포함), (b) 역방향 침입 — 순수/
      혼합 adaptive 상주집단에 대한 고정전략들의 g (ALLD 격퇴 여부),
      (c) 상주 구성 민감도 — Dirichlet 무작위 구성의 침입가능 비율과
      g~ALLD 비중 기울기, (d) Replicator 상태공간 — 끌개 목록·유역 비율,
      3-유형 부분계 위상 초상과 cooperation basin 지도, 9유형 협력 유역
      비율의 with/without adaptive 확장 Δ, (e) Moran 평균장 교차검증.
  H9:
    primary: capricious_payoff_all_vs_alpha_only
    test: paired_perm
    direction: all_greater
    rationale: 귀인 범위 절제의 1차 예측 (의도 변동 추적 실패).
  H10:
    primary: static_cc_all_vs_lambda_only
    test: paired_perm
    direction: all_greater
    rationale: 귀인 범위 절제의 1차 예측 (모호 배신의 기질 오귀인).
  H11:
    primary: keystone_joint        # 결합가설 — 주장 A AND 주장 B (아래)
    test: slope_boot_paired        # CRN 짝지은 Δ 의 dose 기울기 부트스트랩
    direction: both_positive
    claim_A: cooperator_alld_gap_slope    # Δgap(treat−ctrl1) 의 dose 기울기 > 0
    claim_B: group_cc_slope               # ΔCC(treat−ctrl1) 의 dose 기울기 > 0
    rationale: >
      Keystone(핵심종) 가설 — 정교형 AdaptiveAgent 는 스스로 승자가 아니어도
      (H7 경쟁 열세·H8E 침입 실패와 모순되지 않음) 협력자에게 ALLD 대비
      상대이점을 주고(주장 A) 집단 협력률을 높인다(주장 B). 구성(composition)
      인공물을 차단하기 위해 비-swap 구성(특히 ALLD 9/30=30%)을 고정한 치환
      설계를 쓰고, 핵심 대조는 control-1(fixed-λ ToMEmpathic, λ=0.4) — ToM·
      공감 기계를 동일하게 두고 λ 자기조절만 제거하므로 treatment−ctrl1 이
      'λ 위계적 조절이 남을 돕는다' 의 순수 효과다. dose 0 셀은 전 arm 공유
      (Δ≡0 앵커). 주장 A 의 gap 은 기저 조건부 협력자(TFT/GTFT확률/GTFT횟수/
      WSLS) 평균 보수 − ALLD 보수. ALLC 이전 회계(alld_exploit_gain)로 CC
      상승이 착취 이전의 착시인지 가드. 탐색: ALLD 억제·협력자 보호·다이애드
      기제(adaptive→ALLD 의 DD 방어율 vs adaptive→협력자의 CC 유지율)·
      control-2(즉각형)/3(추가 TFT)/4(ALLC) 대조·진화 프레임(협력자 상주에
      adaptive 를 섞을 때 ALLD 침입장벽 심화, ALLD-heavy 상주에 대한 협력자
      클러스터 침입성, 후보 유형별 협력 유역 확장 비교).
  GS:
    primary: none                # 확증 지표 없음 — 전면 탐색(강건성 지도화)
    rationale: >
      게임구조 일반화(협력지수 CI 스윕)는 결론의 강건성 영역을 지도화하는
      민감도 분석이며 확증 가설이 아니다.
  H12:
    primary: keystone_frontier     # 결합가설 — C1 AND C2 AND C3 (아래)
    test: axis_slope_boot          # Π-시드 CRN 곡면 회귀 + 부트 근찾기(교차)
    direction: c1_pos_c2_neg_c3_exists
    confirm_C1: threat_monotone_RP        # R-P: ∂[CC-widening(ad)−CC-widening(rnd)]/∂ρ_D > 0
    confirm_C2: redundancy_monotone_RD    # R-D: ∂[CC-widening(ad)−CC-widening(TFT)]/∂m < 0
    confirm_C3: frontier_crossing_RD      # R-D: adaptive−best_fixed 부호전환 m* 축 범위 내부
    rationale: >
      상주 조건부 Keystone 프런티어 — adaptive 의 '협력 유역 확장' 기여가
      상주 구성에 따라 부호가 뒤집히는 H8E(+0.67)·H11(adaptive<TFT) 상충을
      해소한다. 고정 최대 유형집합 S*(11종: TFT/GTFT확률/GTFT횟수/WSLS/ALLC/
      ALLD/random/capricious/adaptive/adaptive_imm/tom_fixed) 위 단일 심플렉스
      에서 상주를 '지지집합 변경' 이 아니라 '초기점 사전 평균의 대치 슬롯'
      으로 재정의(원칙 A·D). 유형 기여는 제거가 아니라 중립 filler(random)
      대치로 측정(원칙 B). **지표 개정(v0.6.1)**: 이분 유역 폐기 → 종착 행동적
      CC율. CC-widening(X|배경,슬롯) = CC율(Π*,CCm,P_B,슬롯=X) − CC율(...,슬롯=random),
      CC율(x)=xᵀ·CCm·x. C1/C2/C3 는 CC율 곡면 위에서 재계산 —
      지지집합·차원·척도가 모든 상주에서 불변이라 두 선행 결과가 같은 저울에
      오른다(2.1–2.3 인공물 제거). 위협축(R-P ρ_D, R-K ρ_C, R-N env err)과
      중복축(R-D 협력자 다양성 m)을 명시적으로 매개변수화(원칙 C)해 반응 곡면을
      추정한다. 확증: C1 위협 단조성(R-P 기울기>0, Π-시드 군집 부트 CI 0 배제),
      C2 중복 단조성(R-D 비대체성 기울기<0), C3 교차 경계 m* 존재(부트 근찾기,
      축 범위 내부·CI 유계). 교차가 범위를 벗어나면 '관측 범위 내 부재'로
      정직 보고하고 외삽 금지(§6.3). 초기점 사전은 균등(interior)과 ALLD-heavy
      구조적(structural) 두 종을 병기(원칙 E)해 결론 일치를 강건성으로 보고.
      탐색: Shapley 순서무관 기여 φ(adaptive) vs φ(TFT)(C={ad,TFT,GTFT,WSLS},
      2^4 연립)·ALLD 침입장벽 심화 Δg(random 앵커 대비 치환 회계)·R-K 변덕
      대응의 정교(adaptive) vs 즉각(adaptive_imm) 분해(H5 연결)·H8E(고변덕·
      저중복)와 H11(무변덕·고중복)을 곡면 위 두 점으로 재현·정위.

  # ===========================================================================
  # v0.6 확장 (가변 페이오프 · A-B-A 의도복구 · 최적복제자) — §VP/§ABA/§ORE
  # ===========================================================================
  VP:
    # [v0.8.1] 실행 예산 명시화: 종전 은닉 캡(T≤120, seeds≤24)을 폐지하고
    # --vp-rounds/--vp-seeds (기본 240/60) 로 노출. 캡은 비용 관리였을 뿐 원리적
    # 요구가 아니었으며, config 미기록 은닉 불일치를 만들었다. v0.6.6 기준 결과
    # (T=120·seeds=24, C-VP1 Δ=+0.061 p=.015 / C-VP2 +0.049 p=.003 지지)와의
    # 대조 시에는 지평·시드 차이가 교락 축이 됨을 명시한다.
    primary: variable_payoff_advantage   # 결합가설 — C-VP1 AND C-VP2
    test: one_sample_perm                # 시변 레짐 통합 단일표본(부호뒤집기)
    direction: cvp1_pos_and_cvp2_pos
    confirm_C_VP1: payoff_advantage_variable   # 시변 레짐에서 adaptive − best 고정전략 > 0
    confirm_C_VP2: cc_widening_variable        # 시변 레짐에서 종착 행동적 CC-widening(RE) > 0
    rationale: >
      가변 페이오프(연속 협력–경쟁; Pisauro et al. 2022 Space Dilemma B6). H7·H8E·
      H12 의 '고정 payoff·이분법' 교란을 제거하기 위해 협력지수 CI=(R−P)/(T−S)를
      극단(음수 교착·1 이상 조화)까지 라운드별 변동시킨다. 맥락-의존 효용을 계산하는
      adaptive 는, 어떤 단일 고정전략도 전 맥락에서 최적일 수 없는 **시변(time-
      varying) 레짐**(oscillate·blocks·aba)에서 우위를 가져야 한다(고정-극단 레짐은
      대조군). '최고 고정전략' 은 시드별 max(승자의 저주 편향)가 아니라 평균 최고
      전략 1개를 골라 짝짓는다. 협력 유역은 제거가 아니라 중립 filler(random) 대치로
      측정(H12 원칙 B): sub_widening = coop_basin(슬롯=adaptive) − coop_basin(슬롯=
      random). **지표 개정(v0.6.1)**: 이분 협력 유역(라벨 점유>0.5)은 임의 임계와
      라벨-행동 괴리로 폐기하고, 종착 조성의 행동적 CC율 CC(x)=xᵀ·CCm·x(연속·관측
      CC 에서 직접 유도)로 대체한다. CC-widening = 종착 CC율(슬롯=adaptive) − 종착
      CC율(슬롯=random). RE·ORE 병기. **검정 구성 개정(v0.6.2)**: 확증 replicate
      단위는 레짐이 아니라 **시드**(시드 s 마다 Π_s·CCm_s 로 CC율 계산, 동일 X0·시드
      인덱스로 짝지음). 레짐 수준 집계(n=3)는 순열 p 하한(~0.125)에 막혀 효과가 전
      레짐에서 일관돼도 유의에 도달할 수 없는 구조적 검정력 결손이 있었다. 확증:
      C-VP1 시변 레짐 payoff 우위>0(단일표본 순열, 부트 CI 0 배제), C-VP2 시변 레짐
      RE CC-widening>0(시드×레짐 단일표본). [v0.6.3] ToM 공감항 empathy_shift 도
      보수-매개로 일반화되어 focal 뿐 아니라 ToM 생성모형도 맥락 효용을 반영한다
      (기본 보수에서 비트 동일 — H1–H12 불변). 정직 보고: 고정-극단
      레짐(harsh/harmony/deadlock)에서는 최적 고정전략과 대등할 수 있으며(우위 없음이
      정상), 이는 adaptive 의 이점이 '맥락 변동에 대한 강건성' 임을 보인다.
      탐색: 레짐별 우위 분해·ORE sub_widening·맥락(CI) 베이지안 추정.
  ABA:
    primary: intent_recovery              # 결합가설 — C-ABA1 AND C-ABA2
    test: dose_response_slope             # 용서 스윕 회귀 기울기 + 高용서 단일표본
    direction: caba1_recovered_and_caba2_neg_slope
    confirm_C_ABA1: high_forgiveness_recovery   # 高용서: 복구오차<0.15 & CC복원비>0.70
    confirm_C_ABA2: forgiveness_dose_response   # 복구오차∼용서 기울기<0 (부트 CI 상한<0)
    rationale: >
      A→B→A 의도 전환 추적 복구(상대: 협력적 상호성 A=TFT → 착취 B=ALLD → 다시 A).
      **정직 보고 — 사전 예상과 상반된 기제**: 완전한 allostatic 에이전트는 배신(B)
      후 자기보호 상태에 고착되어 A 복귀 시 자동으로 협력을 재개하지 **않는다**
      (히스테리시스). 자기 방어적 배신이 상대의 개심을 관측할 기회를 스스로 차단하는
      '배신 후 선택적 관측' 함정(Selective observation following betrayal)의 재현이다.
      복구는 **용서(forgiveness)=재탐색 성향**에 의해 게이팅된다. 따라서 확증을
      '복구가 무조건 일어난다'가 아니라 '복구가 용서에 의해 용량-반응적으로
      가능해진다'로 조작화한다. C-ABA1: 충분한 용서(0.30)에서 pred_coop 복구오차<0.15
      이고 CC 복원비 CC(A3)/CC(A1)>0.70. C-ABA2: 복구오차가 용서 수준에 단조 감소
      (기울기<0, replicate-수준 부트 CI 상한<0). 확증은 최장 지평에서 판정(짧은
      지평은 국면이 짧아 복구 관측 불충분). 탐색: β-맥락 절제(복구의 β-귀인 필요성)·
      통제권 on/off·비-ToM 베이스라인 행동 복구·자기충족 함정(A3 배신율→복구실패
      기울기, 저용서에서 강함).
  ORE:
    # [v0.8.1] VP 와 동일 — --ore-rounds/--ore-seeds (기본 240/60) 로 예산 명시화.
    primary: ore_basin_expansion          # 결합가설 — C-ORE1 AND C-ORE2
    test: paired_perm_and_one_sample      # 레짐 짝지음 + 단일표본
    direction: core1_ore_gt_re_and_core2_pos
    confirm_C_ORE1: ore_cc_gt_re           # ORE 종착 CC율 > RE 종착 CC율 (레짐 짝지음)
    confirm_C_ORE2: adaptive_cc_widening_ore   # ORE 하 adaptive CC-widening > 0
    rationale: >
      최적복제자방정식(Optimal Replicator Equation; Bravetti & Padilla 2018). 표준
      RE 는 개체 수준 선택만 담아 T>R>P>S 하 항상 배신자가 지배하나, ORE 는 진화가
      집단 수준 경쟁(느린 시간척도)에서도 작동한다는 가정으로 최종 평균적합도
      g(x(τ))=xᵀΠx 최대화 최적제어 문제로 RE 를 확장한다(공상태 p 가 '집단이 최종
      나눌 보상'을 역방향으로 실어나름 → 이기적 개체도 협력). 확증: C-ORE1 동일 Π·
      초기점에서 ORE 협력 유역 > RE 협력 유역(CI 레짐 전반 짝지은 순열), C-ORE2 ORE
      하 adaptive 의 한계 기여 sub_widening(슬롯=adaptive vs random)>0. 재현 검증
      (탐색): Bravetti Fig.1 2-유형(RE→배신 지배, ORE→협력 창발). FBSM(forward-
      backward sweep)으로 경계값문제를 풀되 공상태 폭발(Riccati형)은 보수 규모 배수로
      클램프(종착 조성만 사용하므로 정성 결론 불변). 초기점 전체를 벡터화해 N× 가속.
      정직 보고: deadlock(CI<0)에서 과거 이분 유역은 인공적 고점(≈0.9)을 보였으나,
      행동적 CC율로 보면 낮게 유지된다(협력-라벨 유형이 실제로는 배신) — 지표 개정이
      '유역 점유'와 '실제 상호협력'의 괴리를 드러내 과잉해석을 제거한다.

  # ===========================================================================
  # v0.7.1 확장 (rollout ρ 전파) — 명세서 §3
  # ===========================================================================
  RR:
    primary: rollout_reciprocity_instrumental_cooperation
    test: paired_perm
    direction: rr_greater_coop_and_payoff_on_reciprocal
    confirm_C_RR1: rr_coop_gt_on_tft      # 호혜 상대에서 협력율: rr=True > False
    confirm_C_RR2: rr_null_on_alld        # 착취자에서 무영향 (음성 대조)
    rationale: >
      [v0.7.1 §3] 현행 모형에는 "내 협력이 다음 라운드에 되돌아온다"는 계산이
      어디에도 없다. 동시행동·horizon=1 에서 pc 는 내 후보 행동에 의존하지 않아
      G_self 실용항은 항상 D 를 선호(T>R, P>S)하고, 두 행동의 상태 엔트로피가 같아
      epistemic 도 상쇄된다 — 협력은 오직 λ·G_other 와 infogain 에서만 발생한다.
      게다가 OpponentSimulator 가 rollout step>0 에서 static ToM 으로 후퇴해 ρ 를
      전파하지 않으므로, planning horizon 을 늘려도 호혜의 도구적 가치가 반영되지
      않는다.

      경계(중요): 이 문제를 λ 로 해결하면 안 된다. "호혜적이니 협력이 이득 → λ↑"
      는 λ 를 공감이 아니라 전략 파라미터로 바꿔 구성개념을 붕괴시킨다. ρ 의
      도구적 가치는 λ 가 아니라 EFE/rollout 이 다뤄야 한다 — 따라서 본 확장은
      LambdaRegulator 를 전혀 건드리지 않고 planner 의 rollout 예측만 바꾼다.

      확증: C-RR1 TFT/GTFT 상대에서 rollout_reciprocity=True 가 협력율·보수를
      높인다(도구적 경로가 G_self 에 자연 발생). C-RR2 ALLD 상대에서는 ρ̂≈0 이라
      무영향이어야 한다(음성 대조 — 효과가 ρ 경로로 흐른다는 증거).
      토글 기본 False(기존 보존). horizon=1 에서는 rollout 이 없어 무영향.

  # ===========================================================================
  # v0.8.0 확장 (우도 기억-1 완전화: g·fg 항) — 명세서 §7
  # ===========================================================================
  FG:
    primary: fg_basis_wsls_representability
    test: descriptive_thresholds          # 사영 충실도 임계 (Q3 RMSE, β* 회복)
    direction: wsls_rmse_down_and_beta_up
    confirm_C_FG1: wsls_q3_rmse_le_0.10   # WSLS Q3 RMSE 0.408 → ≤0.10
    confirm_C_FG2: wsls_beta_star_ge_1.5  # β*_wsls 0.79 → ≥1.5 (결정론성 회복)
    confirm_C_FG3: eta_positive_wsls_null_others  # η̂_wsls ≫ 0, 타 전략 η̂≈0
    rationale: >
      [v0.8.0 §7] 현행 우도 P(a_j=C|f,θ)=σ(β(α+ρf+s(λ_j,p))) 의 조건 변수는 f
      하나뿐이다. 표현 가능한 기억-1 시그니처는 제약 P(C|CC)=P(C|CD),
      P(C|DC)=P(C|DD) 를 만족하는 2자유도 부분공간뿐이며, WSLS 는 joint outcome
      조건(XOR 구조, 참 시그니처 [1,0,0,1])이라 이 클래스 **밖**에 있다.

      실증(v0.6.6 full-run): WSLS 경험 시그니처 [0.915,0.094,0.098,0.901] vs 모형
      함의 [0.524,0.524,0.454,0.454], RMSE=0.408 인데 상태 점유 기반 클래스 내 최적
      근사의 하한이 0.406 → 추정 오차 ~0.002. **실패는 추정이 아니라 표현이다.**
      더 심각한 것은 의도성의 체계적 반전: β*_wsls=0.79 로 전 유형 최저(TFT 2.27,
      allc 2.17, alld 1.69). WSLS 는 error=0.05 외 완전 결정론적인데 XOR 신호가 f 로
      주변화되면 ~0.5 동전던지기로 보여 **결정론이 저정밀 잡음으로 오사영**된다.
      파급: allostasis β-게이팅(precision=clip(E_beta/4))이 WSLS 배신을 비의도/맥락
      으로 오귀인 → 기질 증거 억제 → 자기보호 저작동. §1 반사실 귀인도 β̂ 를 쓰므로
      같은 오염을 받는다.

      개정: 우도를 P(a_j=C|f,g,θ)=σ(β(α+ρf+ωg+η·fg+s(λ_j,p))) 로 확장.
      g=상대 자신의 직전 행동(관성/자기일관성), η=f·g 상호작용(결과-조건성/WSLS성).
      기저 (1,f,g,fg) 는 기억-1 시그니처 전 공간(4자유도)을 스팬한다.

      순서 제약(§7.5): §1 을 f-기저에서 완성·검증한 뒤 §7 로 확장한다(역순이면 §1
      검증 기준선이 없음). 반사실 기질 판정은 fg 기저에서 P(D|f=+1, g) 가 되며,
      g 주변화(상대 자기행동 분포로 가중)가 "내가 협력했더라도"의 의미에 부합한다.
      식별 요구 증가는 fg_centered 복원 배터리로 동반 검증(§7.3, 필수).
      토글 기본 "f"(기존 보존). 대부분 상대(TFT/GTFT/ALLC/ALLD)는 ω≈η≈0 이라 큰
      변화가 없어야 하나(음성 대조), WSLS 포함 실험은 실질 변화 예상 → 정직 보고.

# =============================================================================
# [v0.10.0] valence+uncertainty affect 재정초에 따른 가설 재분류
# =============================================================================
# CoreAffect 가 β-deficit·q_z 귀인을 폐기하고 분포적 valence/uncertainty 로 λ 를
# 구동하게 되면서, 가설을 다음과 같이 재분류한다. 확증 검정은 V10 배터리가 새
# 표준이며, 구 RPE-귀인 검증(V9)은 legacy_attrib A/B 재현용으로만 유효하다.
reclassification_v10:
  still_valid:            # 새 모형에서 그대로 검증 가능(재기준선만 필요)
    - H1   # 착취 자기보호 adaptive<fixed — valence↓+U↑ 로 λ 붕괴, 기제 무관하게 성립
    - H2   # λ_final(noisy_tft)>λ_final(exploiter) — valence 서열로 직접 성립
    - H3   # β 판별 — ToM 입자필터 소관, affect 재정초와 독립
    - H4   # CC 비열등 — 행동 결과 지표, 기제 무관
  redefined:             # 새 모형 축으로 맞춤 수정
    V9_1_rpe_scale:      # → V10 valence 스케일: 페이오프↑ 시 valence 진폭↑
    V9_2_setpoint_drift: # 유지(SelfModel 소관) — identity 편입으로 접지(§3.6 재정의)
    V9_3_attrib_branch:  # 폐기 → V10.2 하방불확실 방어로 대체(귀인 없이 방어 분기)
    V9_4_epistemic:      # 유지(EFE 소관, affect 무관)
  deprecated:            # 새 모형에서 검증 불가(기제 폐기)
    H5:                  # 즉각형(vmPFC)/정교형(rmPFC) 반사실 귀인 구분
      reason: >
        귀인(counterfactual dispositional attribution) 자체를 폐기했으므로 즉각/정교
        유형 구분이 무의미. §9.7 조작화-무효 가드가 이미 이를 정직 보고(dz 미정의→
        미지지). 대안 재정의(선택): 즉각형=k_U 큰 하방과민 affect, 정교형=k_U 작은
        affect — 그러나 이는 귀인이 아니라 이득 파라미터 차이이므로 H5 의 원 주장
        (반사실 인과추론)과 다른 가설이다. 강제 재사상하지 않고 폐기로 둔다.
  new_primary_battery: V10   # valence 단조성·하방불확실 방어·expectile·초기화·identity

# =============================================================================
# [v0.11.1] θ-잔차 affect + λ_base self/context 중재에 따른 가설 재분류
# =============================================================================
reclassification_v0_11_1:
  still_valid:            # 새 모형에서 그대로 검증 가능(재기준선)
    - H1   # 착취 자기보호 — v0.11.0 서 방향 역전됐으나 v0.11.1 λ_baseContext
           # (anticipatory)로 복원(dz=-2.31, 방향성립). 기제는 affect→setpoint 로 이동.
    - H2   # λ 서열 — λ_baseContext(θ) 단조성으로 성립(V12 패널 0 참조)
    - H3   # β 판별 — ToM 입자필터 소관, 불변
    - H4   # CC 비열등 — 행동 결과 지표
  redefined:
    V10_1_valence_monotonic: >
      λ 단조성의 기제가 affect(valence)에서 λ_baseContext(θ)로 이동. 검증은 유지되나
      해석을 'θ-예측 협력성의 setpoint 사상 단조성'으로 재규정.
    V10_2_downside_defense: >
      U 의 의미가 하방반편차→θ epistemic(입자간) std 로, 역할이 가산항→게이팅
      (|Δλ| 축소)으로 변경. '고분산→λ↓' 대신 '고 epistemic U→|Δλ| 축소'가 검증 대상.
    V10_4_selfmodel_init: 유지(분포 초기화 E0=P+λ_base(R−P) 불변)
    V10_5_identity_memory: 유지((E,σ) 저장·복원 불변)
    V10_6_expectile_variable: 유지(expectile 코어 불변)
  new_battery:
